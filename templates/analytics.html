{% extends 'base.html' %}{% block content %}<p class="eyebrow">A LOOK AT TODAY’S FLOW</p><h1>Queue analytics</h1><section class="panel chart"><canvas id="services" aria-label="Tokens by service"></canvas></section><section class="stats"><div class="stat"><span>Completed</span><b>{{ done }}</b></div><div class="stat"><span>Skipped</span><b>{{ skipped }}</b></div></section>{% endblock %}{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>new Chart(document.getElementById('services'),{type:'bar',data:{labels:{{ labels|tojson }},datasets:[{label:'Tokens',data:{{ counts|tojson }},backgroundColor:'#147e72'}]},options:{responsive:true,plugins:{legend:{display:false}}}});</script>{% endblock %}
