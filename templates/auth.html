{% extends 'base.html' %}{% block content %}<section class="form-card"><p class="eyebrow">{{ 'MAKE AN ACCOUNT' if register else 'WELCOME BACK' }}</p><h1>{{ 'Join QFlow' if register else 'Sign in' }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if register %}<label>Your name<input name="name" required maxlength="100" autocomplete="name"></label>{% endif %}<label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="{{ 'new-password' if register else 'current-password' }}"></label><button class="button">{{ 'Create account' if register else 'Sign in' }} →</button></form><p class="muted">{% if register %}Already registered? <a href="{{ url_for('login') }}">Sign in</a>{% else %}New to QFlow? <a href="{{ url_for('register') }}">Create an account</a>{% endif %}</p></section>{% endblock %}
